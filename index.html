<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="架空LP制作ポートフォリオ。制作したランディングページを掲載しています。"
    />
    <title>LP Portfolio | Dodekarutin</title>
    <style>
      :root {
        --ink: #171412;
        --muted: #766c63;
        --paper: #f5f0e8;
        --line: rgba(23, 20, 18, 0.14);
        --coffee: #3a241b;
        --fashion: #181716;
        --accent: #b96545;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        font-family: "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
      }

      main {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
        padding: clamp(48px, 8vw, 96px) 0;
      }

      .intro {
        display: grid;
        gap: 14px;
        max-width: 720px;
        margin-bottom: clamp(36px, 6vw, 64px);
      }

      .intro p {
        margin: 0;
        color: var(--muted);
        line-height: 1.8;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(3rem, 8vw, 6.8rem);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .works {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }

      .work-card {
        overflow: hidden;
        color: inherit;
        background: #fffaf2;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 24px 60px rgba(23, 20, 18, 0.08);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .work-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 30px 70px rgba(23, 20, 18, 0.14);
      }

      .work-card__image {
        height: clamp(230px, 28vw, 340px);
        background-position: center;
        background-size: cover;
      }

      .work-card--fashion .work-card__image {
        background-image: linear-gradient(rgba(24, 23, 22, 0.1), rgba(24, 23, 22, 0.36)), url("nuance/assets/nuance-hero.jpg");
      }

      .work-card--coffee .work-card__image {
        background-image: linear-gradient(rgba(58, 36, 27, 0.12), rgba(58, 36, 27, 0.42)), url("drip-dwell/assets/hero-coffee.png");
      }

      .work-card__body {
        display: grid;
        gap: 12px;
        padding: 24px;
      }

      .work-card__meta {
        margin: 0;
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .work-card h2 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(1.8rem, 4vw, 3rem);
        line-height: 1;
      }

      .work-card__link {
        display: inline-flex;
        width: fit-content;
        margin-top: 2px;
        padding: 10px 16px;
        color: #fffaf2;
        background: var(--ink);
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 700;
      }

      @media (max-width: 760px) {
        main {
          width: min(100% - 28px, 1120px);
          padding-top: 40px;
        }

        .works {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Landing Page Portfolio</p>
        <h1 id="page-title">LP Portfolio</h1>
      </section>

      <section class="works" aria-label="制作LP一覧">
        <a class="work-card work-card--fashion" href="nuance/">
          <div class="work-card__image" aria-hidden="true"></div>
          <div class="work-card__body">
            <p class="work-card__meta">Fashion LP</p>
            <h2>NUANCE</h2>
            <span class="work-card__link">見る</span>
          </div>
        </a>

        <a class="work-card work-card--coffee" href="drip-dwell/">
          <div class="work-card__image" aria-hidden="true"></div>
          <div class="work-card__body">
            <p class="work-card__meta">Cafe LP</p>
            <h2>DRIP &amp; DWELL</h2>
            <span class="work-card__link">見る</span>
          </div>
        </a>
      </section>
    </main>
  </body>
</html>
